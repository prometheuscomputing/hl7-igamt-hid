name: Publish hl7-igamt image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set image tags from release
        id: meta
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Node 14.20.0
        uses: actions/setup-node@v4
        with:
          node-version: "14.20.0"

      - name: Frontend build
        working-directory: igamt-hl7-client-v2
        run: |
          npm install
          npm run aot

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Maven package
        run: mvn clean install -DskipTests -B

      - name: Stage JAR
        run: cp bootstrap/target/hl7-igamt.jar hl7-igamt.jar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/prometheuscomputing/hl7-igamt-hid:${{ steps.meta.outputs.tag }}
            ghcr.io/prometheuscomputing/hl7-igamt-hid:${{ steps.meta.outputs.version }}
            ghcr.io/prometheuscomputing/hl7-igamt-hid:latest
