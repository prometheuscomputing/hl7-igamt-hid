name: Publish hl7-igamt image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      # A release is only allowed to ship if it carries every branch listed in
      # .github/release-branches. This stops a branding branch from being
      # released while feature work merged elsewhere is left behind.
      - name: Release contains every integration branch
        run: |
          set -eu
          while IFS= read -r branch || [ "${branch}" != "" ]; do
            case "${branch}" in ''|'#'*) continue ;; esac
            git fetch --quiet origin "${branch}"
            if ! git merge-base --is-ancestor "origin/${branch}" HEAD; then
              echo "::error::release ${{ github.event.release.tag_name }} does not contain origin/${branch}; merge it into the release branch first"
              exit 1
            fi
            echo "contains origin/${branch}"
          done < .github/release-branches

      - name: Set image tags from release
        id: meta
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Node 14.20.0
        uses: actions/setup-node@v4
        with:
          node-version: "14.20.0"

      - name: Frontend build
        working-directory: igamt-hl7-client-v2
        run: |
          npm install
          npm run build-prod

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Check out hl7-auth-hid (auth-utils dependency)
        uses: actions/checkout@v4
        with:
          repository: prometheuscomputing/hl7-auth-hid
          ref: transition
          path: hl7-auth-hid

      - name: Install auth-utils into local Maven repo
        run: mvn -f hl7-auth-hid/pom.xml install -pl auth-utils -am -DskipTests -B

      - name: Maven package
        run: mvn clean install -DskipTests -B

      - name: Stage JAR
        run: cp bootstrap/target/hl7-igamt.jar hl7-igamt.jar

      - name: Verify branding in the application jar
        run: python3 scripts/verify-branding.py hl7-igamt.jar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/prometheuscomputing/hl7-igamt-hid:${{ steps.meta.outputs.tag }}
            ghcr.io/prometheuscomputing/hl7-igamt-hid:${{ steps.meta.outputs.version }}
            ghcr.io/prometheuscomputing/hl7-igamt-hid:latest
