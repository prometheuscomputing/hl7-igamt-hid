<app-dam-layout>

  <ng-template #alerts>
    <app-dam-alerts-container></app-dam-alerts-container>
  </ng-template>

  <ng-template #breadCrumbs>
    <div style="padding: 5px 5px 5px 10px; display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; align-items: center; gap: 15px;">
        <i class="fa fa-envelope"></i>
        <span style="font-size: 1.1em;">Example Messages</span>
        <i class="fa fa-chevron-right"></i>
      </div>
      <div style="display: flex; justify-content: center; align-items: center;">
        <app-dam-fullscreen-button></app-dam-fullscreen-button>
      </div>
    </div>
  </ng-template>

  <ng-template #titleBar>
    <div style="display: flex; flex-direction: column; width: 100%; padding-right: 10px; padding-left: 5px;">
      <div style="display: flex; align-items: center;">
        <div style="flex: 1;">
          <div class="custom-ig-badge entity-badge-dark entity-badge-ig">IG</div>
          <div style="margin-left: 5px; display: inline;">
            <span class="title-text">
              {{ title$ | async }}
            </span>
          </div>
        </div>
        <button *ngIf="igId$ | async as igId" class="btn btn-sm btn-outline-primary" style="margin-right: 8px;"
                (click)="exportAll(igId)" [disabled]="exporting">
          <i class="fa fa-download"></i>
          {{ exporting ? 'Exporting…' : 'Export all' }}
        </button>
        <button *ngIf="igId$ | async as igId" [routerLink]="['/ig', igId]" class="btn btn-sm btn-primary">
          <i class="fa fa-chevron-left"></i>
          Open IG
        </button>
      </div>
    </div>
  </ng-template>

  <ng-template #toolbar>
    <div class="em-toolbar-title">
      <ng-container *ngIf="activeComponent?.header && (activeWorkspace | async) as active">
        <ng-container *ngTemplateOutlet="activeComponent.header; context: { $implicit: active }"></ng-container>
      </ng-container>
    </div>
    <div>
      <app-dam-reset-button></app-dam-reset-button>
      <app-dam-save-button></app-dam-save-button>
    </div>
  </ng-template>

  <ng-template #activeTitleBar>
    <app-active-titlebar
    [active]="activeWorkspace | async"
    [controls]="activeComponent?.controls"
    ></app-active-titlebar>
  </ng-template>

  <ng-template #editorContent>
    <app-dam-editor-outlet></app-dam-editor-outlet>
  </ng-template>

  <ng-template #sideBar>
    <app-side-bar></app-side-bar>
  </ng-template>

</app-dam-layout>
