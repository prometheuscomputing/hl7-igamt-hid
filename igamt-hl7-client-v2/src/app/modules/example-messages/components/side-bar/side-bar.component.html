<div class="input-group sidebar-filter">
  <div class="input-group-prepend">
    <span class="input-group-text"><i class="fa fa-filter"></i></span>
  </div>
  <input (keyup)="filterFn($event.target.value)" class="form-control"
          placeholder="Filter" required style="background-color: #f0f0f0;" type="text">
</div>
<div class="sidebar-controls">
  <app-dam-side-bar-toggle></app-dam-side-bar-toggle>
  <div class="btn-group mr-2" role="group">
    <button  class="btn btn-text btn-sm btn-primary" (click)="expandAll()">
      <i class="fa fa-expand"></i>
    </button>
    <button  class="btn btn-text btn-sm btn-primary"  (click)="collapseAll()">
      <i class="fa fa-compress"></i>
    </button>
  </div>
</div>
<div class="sidebar-content" id="sidebar-content">
  <nav class="exchange-nav">
    <a [routerLink]="['actors']" routerLinkActive="active-node"><i class="fa fa-users"></i> Actors</a>
    <a [routerLink]="['scenarios']" routerLinkActive="active-node"><i class="fa fa-exchange"></i> Scenarios</a>
  </nav>
  <h4 class="messages-heading">Example messages</h4>
  <app-table-of-content
    [nodes]="nodes | async"
    [viewOnly]="viewOnly$ | async"
    [activeMessageId]="activeMessageId$ | async"
    (onCreateExampleMessage)="createExampleMessage($event)"
    (onCopyExampleMessage)="copyExampleMessage($event)"
    (onCopySnippet)="copySnippet($event)"
    (onDeleteExampleMessage)="deleteExampleMessage($event)"
    (onDeleteSnippet)="deleteSnippet($event)"
    (onExportExampleMessage)="exportExampleMessage($event)"
    (onExportSnippet)="exportSnippet($event)"
  ></app-table-of-content>
</div>
