<div id="toc-container" class="toc-container">
  <tree-root #treeroot [nodes]="nodes" [options]="options">
    <ng-template #treeNodeTemplate let-index="index" let-node>
      <ng-container [ngSwitch]="node.data.type">
        <div class="em-toc-entry" [routerLink]="['message', node.data.id]" routerLinkActive="active-node"  *ngSwitchCase="'EXAMPLEMESSAGE'" [contextMenu]="messageContextMenu">
          <span class="badge badge-primary em-toc-mark" title="Message">M</span>
          <span class="em-toc-label">{{ node.data.label }}</span>
          <context-menu #messageContextMenu>
            <ng-template (execute)="exportExampleMessage(node, 'html')" contextMenuItem>
              <i class="fa fa-download"></i> Export HTML
            </ng-template>
            <ng-template (execute)="exportExampleMessage(node, 'txt')" contextMenuItem>
              <i class="fa fa-download"></i> Export Text
            </ng-template>
            <ng-template (execute)="exportExampleMessage(node, 'validation')" contextMenuItem>
              <i class="fa fa-download"></i> Export Validation Report
            </ng-template>
            <ng-template (execute)="copyExampleMessage(node)" contextMenuItem [enabled]="!viewOnly">
              <i class="fa fa-copy"></i> Copy Example Message
            </ng-template>
            <ng-template (execute)="deleteExampleMessage(node)" contextMenuItem [enabled]="!viewOnly">
              <i class="fa fa-trash"></i> Delete Example Message
            </ng-template>
          </context-menu>
        </div>
        <div class="em-toc-entry" *ngSwitchCase="'EXAMPLEMESSAGESNIPPET'" [routerLink]="['message', node.data.messageId, 'snippet', node.data.id]" routerLinkActive="active-node" [contextMenu]="snippetContextMenu">
          <span class="badge em-toc-mark em-toc-mark-snippet" title="Snippet">S</span>
          <span class="em-toc-label">{{ node.data.label }}</span>
          <context-menu #snippetContextMenu>
            <ng-template (execute)="exportSnippet(node, 'html')" contextMenuItem>
              <i class="fa fa-download"></i> Export HTML
            </ng-template>
            <ng-template (execute)="exportSnippet(node, 'txt')" contextMenuItem>
              <i class="fa fa-download"></i> Export Text
            </ng-template>
            <ng-template (execute)="copySnippet(node)" contextMenuItem [enabled]="!viewOnly">
              <i class="fa fa-copy"></i> Copy Snippet
            </ng-template>
            <ng-template (execute)="deleteSnippet(node)" contextMenuItem [enabled]="!viewOnly">
              <i class="fa fa-trash"></i> Delete Snippet
            </ng-template>
          </context-menu>
        </div>
        <ng-container *ngSwitchDefault>
          <div [contextMenu]="profileContexMenu" >
            <app-display-section [element]="node.data"></app-display-section>
            <context-menu #profileContexMenu>
              <ng-template (execute)="createExampleMessage(node.data.id)" contextMenuItem [enabled]="!viewOnly">
                <i class="fa fa-plus"></i> Create Example Message
              </ng-template>
            </context-menu>
          </div>
        </ng-container>
      </ng-container>
    </ng-template>
  </tree-root>
</div>
